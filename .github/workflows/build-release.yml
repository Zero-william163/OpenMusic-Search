name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -path "*cmdline-tools*" 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          echo "KEYSTORE_PATH=app/release-keystore.jks" >> $GITHUB_ENV

      - name: Write local.properties (API keys)
        run: |
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" > local.properties
          echo "FREESOUND_API_KEY=${{ secrets.FREESOUND_API_KEY }}" >> local.properties
          echo "JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}" >> local.properties

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          echo "=== APK outputs tree ==="
          find app/build/outputs -type f || true
          APK_PATH=$(find app/build/outputs -name "*.apk" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found!"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 1048576 ]; then
            echo "::error::APK too small (< 1MB), build likely failed."
            exit 1
          fi
          FILE_TYPE=$(file -b "$APK_PATH")
          echo "File type: $FILE_TYPE"
          echo "$FILE_TYPE" | grep -qiE "zip|jar|apk" || { echo "::error::Not a valid APK"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: apk

      - name: Rename APK
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          APK_FILE=$(find apk -name "*.apk" | head -1)
          VERSION=$(echo "$TAG" | sed 's/^v//')
          cp "$APK_FILE" "OpenMusicSearch-v${VERSION}.apk"
          echo "RELEASE_APK=OpenMusicSearch-v${VERSION}.apk" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenMusic Search ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.RELEASE_APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
